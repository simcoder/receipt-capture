appId: host.exp.Exponent
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Sign in"
    commands:
      - tapOn: "Username"
      - inputText: ${MAESTRO_USERNAME}
      - tapOn: "Password"
      - inputText: ${MAESTRO_PASSWORD}
      - tapOn: "Receipt capture"
      - tapOn: "Sign in"
      - runFlow:
          when:
            visible: "Sign in"
          commands:
            - tapOn: "Sign in"
      - extendedWaitUntil:
          visible: "Receipts"
          timeout: 30000
- runFlow:
    when:
      notVisible: "Tap to choose from library"
    commands:
      - tapOn: "Capture"
- assertVisible: "Tap to choose from library"
- assertNotVisible: "The camera could not be opened"
- runFlow:
    when:
      visible: "Use a fake receipt"
    file: review.yaml
